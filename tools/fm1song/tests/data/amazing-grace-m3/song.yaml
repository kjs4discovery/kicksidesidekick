# Song source file, format fm1-song/1 (docs/song-format.md). song.mid holds the notes; this file holds
# everything a musician would put on a lead sheet. The music is the planning chat's draft sample
# (format v0.1, 2026-11-04), unchanged; this file was moved to v1 in Milestone M1a.
format: fm1-song/1
slug: amazing-grace
title: Amazing Grace
category: Hymns                 # M3: the list's folder (format 1.2)

credits:
  music: '"New Britain", traditional American hymn tune (first printed 1830s; unverified)'
  words: John Newton (1779)
  arrangement: FM-1 Accompaniment project (generated by make_amazing_grace.py)

rights:
  composition: public domain        # basis: published long before 1931 (US rule of thumb)
  arrangement_license: TBD          # deferred (HANDOFF 2026-11-05 07:00)
  generated: make_amazing_grace.py  # D004: the notes come from a script, not a recording or a score

music:
  key: G
  time_signature: 3/4
  tempo_bpm: 84
  pickup_beats: 1                   # bar 0 is a pickup bar; only its last beat is played
  feel: straight                    # straight | swing

# Bar numbers as a musician counts them: bar 0 = the pickup bar, bar 1 = the first full bar.
form:
  - { section: Verse 1, bars: 1-16, chart: verse }
  - { section: Verse 2, bars: 17-32, chart: verse }

layers:
  drums:
    channel: 10
    variants:
      1: kick on 1, ride on every beat
      2: adds side-stick on 2 and 3, small fills every 8 bars
  bass:
    channel: 3
    program: 33                     # GM acoustic bass
    variants:
      1: root note, once per chord
      2: root on beat 1, fifth on beat 3
  harmony:
    channel: 2
    program: 5                      # GM electric piano 1
    variants:
      1: root-position triads, held for the whole chord
      2: smooth inversions, waltz rhythm (1 long, 2-3 short)
  melody:
    channel: 1
    program: 74                     # GM flute
    variants:
      1: the tune (with lyric events; not used yet)

# The lead sheet. One token per chord; "." holds the previous chord one more beat.
# A bar with several tokens and no "." splits the bar evenly.
chart:
  pickup: "| N.C. |"
  verse: |
    | G | G7 | C  | G | G  | Em | D | D7     |
    | G | G7 | C  | G | Em | D  | G | G . D7 |
  ending: "| G |"                   # replaces the last bar of the song
