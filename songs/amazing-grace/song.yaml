# Song source file, DRAFT format v0.1 (see vault: Specs/Song Format Draft).
# Written by the planning chat as a test sample. song.mid holds the notes;
# this file holds everything a musician would put on a lead sheet.
format: fm1-song-source/0.1
slug: amazing-grace
title: Amazing Grace

credits:
  music: '"New Britain", traditional American hymn tune (first printed 1830s; unverified)'
  words: John Newton (1779)
  arrangement: FM-1 Accompaniment project (generated by make_amazing_grace.py)

rights:
  composition: public domain        # basis: published long before 1931 (US rule of thumb)
  arrangement_license: TBD          # open question; proposal: CC0-1.0

music:
  key: G
  time_signature: 3/4
  tempo_bpm: 84
  pickup_beats: 1                   # bar 0 is a pickup bar; only its last beat is played
  feel: straight                    # straight | swing

# Sections refer to bar numbers in song.mid (bar 0 = pickup bar).
form:
  - { section: Verse 1, bars: 1-16 }
  - { section: Verse 2, bars: 17-32 }

layers:
  drums:
    channel: 10
    variants:
      1: kick on 1, ride on every beat
      2: adds side-stick on 2 and 3, small fills every 8 bars
  bass:
    channel: 3
    sound: acoustic bass (GM 33)
    variants:
      1: root note, once per chord
      2: root on beat 1, fifth on beat 3
  harmony:
    channel: 2
    sound: electric piano (GM 5)
    variants:
      1: root-position triads, held for the whole chord      # what the keyboard view shows at level 1
      2: smooth inversions, waltz rhythm (1 long, 2-3 short)   # ...and at level 2
  melody:
    channel: 1
    sound: flute (GM 74)
    lyrics: true                    # MIDI lyric events; not used in Phase 1

# The lead sheet. One token per chord; "." holds the previous chord one more beat.
# A bar with several tokens and no "." splits the bar evenly.
chart:
  pickup: "| N.C. |"
  verse: |
    | G | G7 | C  | G | G  | Em | D | D7     |
    | G | G7 | C  | G | Em | D  | G | G . D7 |
  ending: "| G |"                   # replaces the last bar of the final verse
