name: Bug report
description: Something in KickSide does not work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. Please do not post anything private. If the FM-1 will not start, see "Going back to the official
        firmware" in the README first.
  - type: input
    id: version
    attributes:
      label: KickSide version
      description: The splash screen shows it at the lower right, for example 0.10.5-m10.4.
    validations:
      required: true
  - type: input
    id: identity
    attributes:
      label: Firmware identity
      description: "From `fm1_install.py --info` or `tools/fm1song.sh list` (both only read). Looks like FM-1_46001005."
  - type: input
    id: flash
    attributes:
      label: Flash chip
      description: The flash chip line on the Settings screen (0x856014 or 0xB36014), if you can see it.
  - type: dropdown
    id: install
    attributes:
      label: How it was installed
      options:
        - The Firmware Hub
        - fm1_install.py
        - Built it myself
        - Not sure
  - type: input
    id: previous
    attributes:
      label: Firmware before KickSide
      description: For example official V15, or another custom firmware.
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - SONG LEARN
        - BACKTRACK
        - SYNTH
        - Start-up or the mode screen
        - Sending songs from the laptop
        - Other
    validations:
      required: true
  - type: input
    id: song
    attributes:
      label: Song or backtrack
      description: The name, and the level of each layer if it matters.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: The exact steps, and any message on the screen.
    validations:
      required: true
